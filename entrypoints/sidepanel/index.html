<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>SeenX - X 浏览历史与全文检索</title>
    <script>
      try {
        const stored = localStorage.getItem("seenx_language");
        const valid = ["en", "zh", "zh-TW", "ja", "es", "pt", "id", "de", "fr", "tr", "ar", "ko"];
        const lang = (stored && valid.includes(stored)) ? stored : "en";
        document.title = (lang === "zh" || lang === "zh-TW") ? "SeenX - X 浏览历史与全文检索" : "SeenX - X Browsing History & Search";
        document.documentElement.lang = lang;
        if (lang === "ar") document.documentElement.dir = "rtl";
      } catch (e) {}
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        min-width: 0;
      }
    </style>
  </head>
  <body class="bg-black text-[#e7e9ea] antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
